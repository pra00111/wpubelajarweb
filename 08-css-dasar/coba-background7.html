<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Background</title>
    <style>
      body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #333;
      }
      .frame {
        width: 400px;
        height: 400px;
        border: 8px solid white;
        margin: auto;
        background-image:
          url(Gallery/we.png), url(Gallery/blob.svg), url(Gallery/bg2.png);
        background-size: 370px, 400px, 450px;
        background-position:
          center bottom,
          center 80%,
          left bottom;
        background-repeat: no-repeat, no-repeat, no-repeat;
        background-color: #f0f0f0;
        border-radius: 50%;
      }
      h1 {
        color: white;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 40px;
        text-shadow: 2px 2px 15 #000;
      }
    </style>
  </head>
  <body>
    <h1>My Profile Card</h1>
    <div class="frame"></div>
  </body>
</html>
