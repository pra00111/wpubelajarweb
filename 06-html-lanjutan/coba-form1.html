<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Elemen Form</title>
  </head>
  <body>
    <h1>Contoh elemen-elemen form pada HTML</h1>

    <form>
      <label for="nama"
        >Nama:
        <input type="text" id="nama" name="nama" />
      </label>
      <br />
      <label for="email"
        >Email:
        <input type="email" id="email" name="email" />
      </label>
      <br />
      <label for="number"
        >Angka:
        <input
          type="number"
          id="number"
          name="number"
          min="0"
          max="100"
          step="5"
        />
      </label>
      <br />
      <label for="password"
        >password:
        <input type="password" id="password" name="password" />
      </label>
      <br />
      <label for="date"
        >Tanggal:
        <input type="date" id="date" name="date" />
      </label>
      <br />
      <label for="color"
        >Warna Favorit:
        <input type="color" id="color" name="color" />
      </label>
      <br />
      <button type="submit">Kirim</button>
    </form>
  </body>
</html>
