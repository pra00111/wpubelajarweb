<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Background</title>
    <style>
      body {
        background-color: lightblue;
        background-image: linear-gradient(to left, lightblue, lightgreen);
        height: 100vh;
      }
      .kotak1 {
        width: 400px;
        height: 400px;
        background-color: navy;
        background-image: linear-gradient(navy, orange);
      }
      .kotak2 {
        width: 400px;
        height: 400px;
        background-color: maroon;
        background-image: radial-gradient(maroon, yellow);
      }
      .kotak3 {
        width: 400px;
        height: 400px;
        background-color: purple;
        background-image: conic-gradient(purple, white, blue);
      }
    </style>
  </head>
  <body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
  </body>
</html>
