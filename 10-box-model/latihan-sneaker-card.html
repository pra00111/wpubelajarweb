<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sneaker Card</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #f5f5f5;
        font-family: Arial, Helvetica, sans-serif;
        padding: 40px;
      }
      .product-card {
        background-color: #fff;
        width: 330px;
        margin: 0 auto;
        padding: 24px;
        border-radius: 16px;
        border: 2px solid #e0e0e0;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      }
      .product-image {
        width: 100%;
        height: 200px;
        overflow: hidden;
        border-radius: 12px;
        margin-bottom: 20px;
      }
      .product-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .product-category {
        font-size: 12px;
        color: #06c;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: bold;
        margin-bottom: 8px;
      }
      .product-title {
        font-size: 20px;
        font-weight: bold;
        color: #333;
        margin-bottom: 20px;
      }
      .product-description {
        font-size: 14px;
        color: #666;
        line-height: 1.6;
        padding-bottom: 20px;
        border-bottom: 1px solid #eee0e0;
        margin-bottom: 20px;
      }
      .price-section {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 20px;
      }
      .price {
        font-size: 18px;
        color: #e91e63;
        font-weight: bold;
      }
      .original-price {
        font-size: 14px;
        color: #999;
        text-decoration: line-through;
      }
      .size-option-wrapper {
        border: none;
        margin-bottom: 20px;
      }
      .size-label-text {
        font-size: 14px;
        color: #333;
        margin-bottom: 8px;
      }
      .size-options {
        display: flex;
        gap: 12px;
      }
      .size-options input[type="radio"] {
        display: none;
      }
      .size-options label {
        display: inline-block;
        font-weight: bold;
        padding: 8px 16px;
        border-radius: 8px;
        background-color: #e0e0e0;
        cursor: pointer;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }
      .size-options input[type="radio"]:checked + label {
        background-color: #06c;
        color: #fff;
      }
      .buy-bottom {
        text-transform: uppercase;
        font-weight: bold;
        letter-spacing: 1px;
        width: 100%;
        padding: 12px 0;
        background-color: #06c;
        color: #fff;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        transition: 0.3s ease;
      }
      .buy-bottom:hover {
        background-color: #034c95;
      }
    </style>
  </head>
  <body>
    <article class="product-card">
      <figure class="product-image">
        <img src="img/nike-red.jpg" alt="Sneaker Nike Red" />
      </figure>

      <p class="product-category">Nike sportwear</p>

      <h3 class="product-title">Air Max Essential</h3>
      <p class="product-description">
        Nike Air Max Essential adalah model sepatu Nike yang terbuat dari bahan
        berkualitas tinggi dan dilengkapi dengan teknologi khusus Nike Air Max.
      </p>
      <div class="price-section">
        <span class="price">IDR 1.899.000</span>
        <del class="original-price">IDR 2.299.000</del>
      </div>
      <form>
        <fieldset class="size-option-wrapper">
          <legend class="size-label-text">Pilih Ukuran (US)</legend>
          <div class="size-options">
            <input type="radio" name="size" id="size-8" value="8" />
            <label for="size-8">8</label>

            <input type="radio" name="size" id="size-9" value="9" />
            <label for="size-9">9</label>

            <input type="radio" name="size" id="size-10" value="10" />
            <label for="size-10">10</label>

            <input type="radio" name="size" id="size-11" value="11" />
            <label for="size-11">11</label>

            <input type="radio" name="size" id="size-12" value="12" />
            <label for="size-12">12</label>
          </div>
        </fieldset>
        <button class="buy-bottom" type="submit">tambahkan ke keranjang</button>
      </form>
    </article>
  </body>
</html>
