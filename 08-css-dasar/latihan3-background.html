<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Quote Galau</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        color: rgb(254, 247, 247);
        text-align: center;
        background-color: #0d253c;
        background-image: url(https://fastly.picsum.photos/id/653/200/300.jpg?hmac=-wtNmzX9vRed_gkrBqMwx0wVWWD6uczwVxllG2txJXs);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        min-height: 100vh;
      }

      h1 {
        font-size: 48px;
        text-transform: uppercase;
        font-style: italic;
        color: transparent;
        letter-spacing: 10px;
        text-decoration: none;
        /* text-shadow: 5px 5px 0 rgb(215 215 215/10%); */
        background-image: linear-gradient(to right, blue, purple);
        background-clip: text;
        filter: drop-shadow(0 -2px 20px rgba(249, 102, 102, 0.9));
      }
      .quote {
        font-size: 22px;
        line-height: 2.2;
        word-spacing: 5px;
        background-color: rgb(255, 255, 255, 0.2);
        max-width: 700px;
        margin: auto;
        padding: 20px;
        border-radius: 10px;
        border: 1px solid rgb(255, 255, 255, 0.3);
        box-shadow: 0 10px 10px rgba(0, 0, 0, 0.5);
      }

      span {
        color: crimson;
        text-decoration: none;
        text-shadow: 0 0 5px rgb(243, 45, 85, 0.8);
      }

      .credit {
        font-size: 12px;
        letter-spacing: 2px;
        color: rgb(255, 255, 255, 0.7);
        font-weight: normal;
        text-transform: uppercase;
        border-top: 1px solid rgb(151, 151, 151, 0.5);
        width: 30%;
        margin: 50px auto;
        padding-top: 20px;
      }
    </style>
  </head>

  <body>
    <h1>fase runtuh</h1>

    <p class="quote">
      "Tak perlu khawatir, ku hanya <span>terluka</span>. <br />
      Terbiasa tuk pura-pura tertawa. <br />
      Namun bolehkah sekali saja ku menangis? <br />
      Sebelum kembali membohongi diri."
    </p>

    <p class="credit">— feby putri feat. fiersa besari</p>
  </body>
</html>
